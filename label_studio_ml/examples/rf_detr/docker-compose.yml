services:
  rf_detr:
    container_name: rf_detr_ml_backend
    build:
      context: .
      args:
        TEST_ENV: ${TEST_ENV}
    environment:
      - LABEL_STUDIO_URL=${LABEL_STUDIO_URL}
      - LABEL_STUDIO_API_KEY=${LABEL_STUDIO_API_KEY}
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=${LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT:-/label-studio/files}
      # Path to your custom checkpoint (.pt / .pth). Leave empty to use pretrained COCO weights.
      - CHECKPOINT_PATH=${CHECKPOINT_PATH}
      # Model size when not using custom checkpoint: nano, small, medium, large
      - MODEL_SIZE=${MODEL_SIZE}
      # Optional: path to class names (JSON array or newline-separated). Default: COCO classes.
      - CLASSES_FILE=${CLASSES_FILE}
      - INFERENCE_MODE=${INFERENCE_MODE}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD}
      - DEVICE=${DEVICE}
      - LOG_LEVEL=${LOG_LEVEL}
      - WORKERS=${WORKERS}
      - THREADS=${THREADS}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${PORT}:9090"
    volumes:
      - "./data/server:/data"
      - ${LOCAL_STORAGE_PATH}:/label-studio/files:rw
